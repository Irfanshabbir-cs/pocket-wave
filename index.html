<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocketwave – Personal Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <div class="toast" id="toast"></div>
  <button class="mail" id="mail" aria-live="polite"></button>
  <div class="auth" id="auth">
    <div class="brand"><div class="drop"></div><h1>Pocketwave</h1><p>Track spending. Stay afloat.</p></div>
    <div class="card acard">
      <form class="vw on" id="f-login" novalidate>
        <h3>Welcome back</h3><p class="s">Log in to see your wave.</p>
        <label class="fld"><span>Email</span><input id="l-e" type="email" autocomplete="email" placeholder="you@example.com"></label>
        <label class="fld"><span>Password</span><div class="pwr"><input id="l-p" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" class="show">Show</button></div></label>
        <div class="err" id="e-l" role="alert"></div>
        <button class="save" type="submit">Log in</button>
        <button type="button" class="lnk" data-go="f-signup">New here? Create an account</button>
      </form>
      <form class="vw" id="f-signup" novalidate>
        <h3>Create account</h3><p class="s">We will email you a code to confirm it is really you.</p>
        <label class="fld"><span>Name</span><input id="s-n" autocomplete="name" placeholder="Your name"></label>
        <label class="fld"><span>Email</span><input id="s-e" type="email" autocomplete="email" placeholder="you@example.com"></label>
        <label class="fld"><span>Password</span><div class="pwr"><input id="s-p" type="password" autocomplete="new-password" placeholder="At least 8 characters"><button type="button" class="show">Show</button></div></label>
        <div class="err" id="e-s" role="alert"></div>
        <button class="save" type="submit">Send my code</button>
        <button type="button" class="lnk" data-go="f-login">Already have an account? Log in</button>
      </form>
      <form class="vw" id="f-verify" novalidate>
        <h3>Check your email</h3><p class="s">We sent a 6-digit code to <b id="ve"></b>. It expires in 10 minutes.</p>
        <div class="code" id="code"></div>
        <div class="err" id="e-v" role="alert"></div>
        <button class="save" type="submit">Confirm email</button>
        <button type="button" class="lnk" id="resend">Resend code</button>
        <button type="button" class="lnk" data-go="f-signup">Use a different email</button>
      </form>
    </div>
    <p class="note" id="note"></p>
  </div>
  <header><div><p id="hi">Good day</p><h1 id="ttl">Pocketwave</h1></div><div class="hb"><button class="ic" id="theme" aria-label="Switch theme">🌗</button><button class="ic" id="out" aria-label="Log out"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#0e0e10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg></button></div></header>
  <main>
    <section class="screen on" id="s-home"></section>
    <section class="screen" id="s-bud"></section>
    <section class="screen" id="s-goal"></section>
    <section class="screen" id="s-stat"></section>
  </main>
  <nav>
    <button class="t on" data-t="home"><span><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg></span>Home</button>
    <button class="t" data-t="bud"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg></span>Budgets</button>
    <div class="sp"></div>
    <button class="t" data-t="goal"><span><svg viewBox="0 0 24 24"><path d="M3 20l6-10 4 6 3-4 5 8z"/></svg></span>Goals</button>
    <button class="t" data-t="stat"><span><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>Stats</button>
    <button class="fab" id="fab" aria-label="Add transaction">+</button>
  </nav>
  <div class="veil" id="veil"></div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="seg" id="seg"><u></u><button class="on" data-k="exp">Expense</button><button data-k="inc">Income</button></div>
    <div class="amt" id="amt">$0</div>
    <div class="chips" id="chips"></div>
    <div class="keys" id="keys"></div>
    <button class="save" id="save">Save expense</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
